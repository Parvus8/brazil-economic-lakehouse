name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  spark:
    name: Spark e qualidade de dados (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r docker/spark/requirements.txt pytest==9.1.1
      - run: pytest tests/spark

  k8s-manifests:
    name: Manifestos do Kubernetes e Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: kubectl kustomize k8s/base > /dev/null
      - run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm template airflow apache-airflow/airflow --version 1.22.0 --namespace lakehouse \
            -f k8s/airflow-values.yaml > /dev/null

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    env:
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docker/dbt/requirements.txt
      - run: dbt parse --project-dir dbt_project --profiles-dir dbt_project --target docker
