lakehouse:
  target: docker
  outputs:
    docker:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/opt/airflow/warehouse/warehouse.duckdb') }}"
      threads: 4
      external_root: "{{ env_var('GOLD_URI', 's3://gold/marts') }}"
      extensions:
        - httpfs
        - iceberg
      secrets:
        - type: s3
          key_id: "{{ env_var('S3_ACCESS_KEY') }}"
          secret: "{{ env_var('S3_SECRET_KEY') }}"
          endpoint: "{{ env_var('DUCKDB_S3_ENDPOINT', 'seaweedfs:8333') }}"
          region: us-east-1
          url_style: path
          use_ssl: false
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../warehouse/warehouse.duckdb') }}"
      threads: 4
      external_root: "{{ env_var('GOLD_URI', 's3://gold/marts') }}"
      extensions:
        - httpfs
        - iceberg
      secrets:
        - type: s3
          key_id: "{{ env_var('S3_ACCESS_KEY') }}"
          secret: "{{ env_var('S3_SECRET_KEY') }}"
          endpoint: "{{ env_var('DUCKDB_S3_ENDPOINT', 'localhost:8333') }}"
          region: us-east-1
          url_style: path
          use_ssl: false
