# Values do Helm chart oficial do Apache Airflow (apache-airflow/airflow 1.22.0).
# Todos os segredos são referenciados pelo nome; o `make k8s-secrets` cria os Secrets a partir do .env.

airflowVersion: "3.3.2"
defaultAirflowRepository: brazil-economic-lakehouse/airflow-k8s
defaultAirflowTag: dev
images:
  airflow:
    repository: brazil-economic-lakehouse/airflow-k8s
    tag: dev
    pullPolicy: IfNotPresent

# Perfil restricted do Pod Security em todos os pods do Airflow (a imagem já roda como o usuário airflow, 50000).
securityContexts:
  pod:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

# Cada tarefa roda no próprio pod. As tarefas de Spark e dbt vão além e criam pods com imagens próprias via
# KubernetesPodOperator (a service account dos workers tem permissão para criar pods).
executor: KubernetesExecutor
allowPodLaunching: true

# As DAGs e o pacote lakehouse vêm embutidos na imagem (docker/airflow/Dockerfile, target "kubernetes").
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

# Banco de metadados: PostgreSQL próprio (k8s/base/postgres.yaml) no lugar do Bitnami descontinuado do chart.
postgresql:
  enabled: false
data:
  metadataSecretName: airflow-metadata
redis:
  enabled: false
statsd:
  enabled: false

fernetKeySecretName: airflow-secrets
jwtSecretName: airflow-secrets
apiSecretKeySecretName: airflow-secrets

# O Airflow 3 usa o simple auth manager; o job de usuário do chart depende do FAB auth manager.
createUserJob:
  enabled: false
# Como hook post-install do Helm, o job de migração só começaria depois que o `helm --wait` visse todos os
# pods prontos, enquanto os pods esperam a migração: um deadlock. Como Job comum, ele roda junto com os pods.
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  # Mantém o Job concluído enquanto o `helm --wait` ainda o verifica.
  ttlSecondsAfterFinished: 3600

env:
  - name: LAKEHOUSE_RUNTIME
    value: kubernetes
  - name: LAKEHOUSE_NAMESPACE
    value: lakehouse
  - name: LAKEHOUSE_SPARK_IMAGE
    value: brazil-economic-lakehouse/spark:dev
  - name: LAKEHOUSE_DBT_IMAGE
    value: brazil-economic-lakehouse/dbt:dev
  - name: S3_ENDPOINT_URL
    value: http://seaweedfs:8333
  - name: PIPELINE_START_YEAR
    value: "2018"
  - name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS
    value: "false"
  - name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS
    value: admin:admin

# Conexão usada nos logs remotos. Os pods das tarefas são apagados ao terminar, então os logs vão para o object storage.
secret:
  - envName: AIRFLOW_CONN_LAKEHOUSE_LOGS
    secretName: airflow-logs-connection
    secretKey: connection

config:
  core:
    # O chart usa o FAB auth manager por padrão; este projeto usa o simple auth manager do Airflow 3 em todo lugar.
    auth_manager: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    load_examples: "False"
    dags_are_paused_at_creation: "True"
  logging:
    remote_logging: "True"
    remote_base_log_folder: s3://airflow-logs
    remote_log_conn_id: lakehouse_logs

# Só os pods de worker (as tarefas de extração) recebem as credenciais S3 do pipeline.
workers:
  env:
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: lakehouse-pipeline-s3
          key: S3_ACCESS_KEY
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: lakehouse-pipeline-s3
          key: S3_SECRET_KEY
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# A senha do admin vem de um Secret em vez de ser gerada dentro do pod. O Airflow abre o arquivo de senhas para
# leitura e escrita, e volumes de Secret são somente leitura, então um init container o copia para um emptyDir.
apiServer:
  env:
    - name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE
      value: /opt/airflow/auth/passwords.json
  extraInitContainers:
    - name: copy-admin-password
      image: brazil-economic-lakehouse/airflow-k8s:dev
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "cp /auth-secret/passwords.json /opt/airflow/auth/passwords.json"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: auth-secret
          mountPath: /auth-secret
          readOnly: true
        - name: auth
          mountPath: /opt/airflow/auth
  extraVolumes:
    - name: auth-secret
      secret:
        secretName: airflow-auth
    - name: auth
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
  extraVolumeMounts:
    - name: auth
      mountPath: /opt/airflow/auth
  # Num cluster de um nó a CPU fica disputada na inicialização; o padrão (60s) reiniciava o API server repetidamente.
  startupProbe:
    failureThreshold: 18
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

scheduler:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

dagProcessor:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi

triggerer:
  persistence:
    enabled: false
  # Com 512Mi ocorria OOMKilled: o triggerer do Airflow 3 executa os triggers num subprocesso separado.
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi

logs:
  persistence:
    enabled: false
