# Painel em Streamlit: consumidor somente leitura do bucket gold. Exposto só dentro do cluster
# (ClusterIP); acesse com `make k8s-dashboard` (kubectl port-forward).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: brazil-economic-lakehouse/dashboard:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: lakehouse-dashboard-s3
          env:
            - name: S3_ENDPOINT
              value: seaweedfs:8333
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector:
    app: dashboard
  ports:
    - port: 8501
