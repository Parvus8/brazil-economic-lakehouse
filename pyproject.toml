[project]
name = "brazil-economic-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["logs", "dbt_project"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
